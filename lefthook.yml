# Git clients in IDEs start the hook without mise in the shell, so tools come through mise exec.
lefthook: mise exec -- lefthook

pre-commit:
  parallel: true
  jobs:
    - name: backend
      root: backend/
      glob: "backend/**"
      group:
        jobs:
          - name: backend format
            glob: "*.go"
            run: golangci-lint fmt {staged_files}
            stage_fixed: true
          - name: backend lint
            run: just lint && go mod tidy -diff

    - name: agent
      root: agent/verification/
      glob: "agent/verification/**"
      group:
        jobs:
          - name: agent format
            glob: "*.go"
            run: golangci-lint fmt {staged_files}
            stage_fixed: true
          - name: agent lint
            run: just lint && go mod tidy -diff

    - name: frontend
      root: frontend/
      glob: "frontend/**"
      group:
        jobs:
          - name: frontend format
            glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,md,yaml,yml}"
            run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - name: frontend lint
            run: pnpm lint && pnpm typecheck

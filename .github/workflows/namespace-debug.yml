name: Namespace debug (temporary)

on:
  push:
    branches: [fix/namespace-ci]

permissions:
  contents: read

jobs:
  podman-repro:
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: "just"

      - name: Install Podman and start its socket without systemd
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman fuse-overlayfs
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n[storage.options.overlay]\nmount_program = "/usr/bin/fuse-overlayfs"\n' | sudo tee /etc/containers/storage.conf
          printf '[network]\nfirewall_driver = "iptables"\n' | sudo tee /etc/containers/containers.conf
          sudo mount -o remount,rw /proc/sys && echo "proc/sys remounted rw" || echo "remount failed"
          sudo sysctl -w net.ipv4.ip_forward=1 || true
          sudo mkdir -p /run/podman
          sudo sh -c 'nohup podman system service --time=0 unix:///run/podman/podman.sock > /tmp/podman-service.log 2>&1 &'
          for i in $(seq 1 30); do sudo test -S /run/podman/podman.sock && break; sleep 1; done
          sudo podman info --format '{{.Host.OCIRuntime.Name}} cgroups={{.Host.CgroupsVersion}}'
          sudo podman run --rm docker.io/library/alpine:3.20 echo podman-runs-containers
          sudo podman network create probe-net && sudo podman run --rm --network probe-net docker.io/library/alpine:3.20 echo bridge-network-works

      - name: Run e2e tests on Podman
        run: |
          cd agent/verification
          just e2e-podman

      - name: Show Podman service log
        if: always()
        run: sudo cat /tmp/podman-service.log || true

  readonly-probe:
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: databasus-readonly-probe:latest

      - name: Reproduce the read-only case and watch the container
        run: |
          set -x
          data_root=$(mktemp -d /tmp/databasus-readonly.XXXX)
          docker run --rm --entrypoint /bin/sh --volume "$data_root:/data" databasus-readonly-probe:latest -eu -c '
            mkdir -p /data/pgdata /data/temp /data/backups
            chown 999:999 /data /data/pgdata /data/temp /data/backups
            chmod 0770 /data /data/backups
            chmod 0700 /data/pgdata /data/temp'
          sudo ls -la "$data_root"
          docker run --detach --name ro-probe --env PUID=999 --env PGID=999 \
            --mount "type=bind,source=$data_root,target=/databasus-data,readonly" \
            databasus-readonly-probe:latest
          for i in $(seq 1 30); do
            echo "t=${i}s $(docker inspect --format 'running={{.State.Running}} exit={{.State.ExitCode}}' ro-probe)"
            sleep 1
          done
          docker logs ro-probe 2>&1 | tail -60
          docker exec ro-probe sh -c 'grep databasus-data /proc/mounts' || true
          docker rm -f ro-probe
          echo "--- -v :ro syntax"
          docker run --rm -v "$data_root:/d:ro" --entrypoint sh databasus-readonly-probe:latest -c 'grep " /d " /proc/mounts; touch /d/x && echo WRITABLE || echo READONLY'
          echo "--- named volume readonly"
          docker volume create ro-vol
          docker run --rm --mount type=volume,src=ro-vol,dst=/d,readonly --entrypoint sh databasus-readonly-probe:latest -c 'grep " /d " /proc/mounts; touch /d/x && echo WRITABLE || echo READONLY'
          echo "--- tmpfs readonly"
          docker run --rm --mount type=tmpfs,dst=/d,readonly --entrypoint sh databasus-readonly-probe:latest -c 'grep " /d " /proc/mounts; touch /d/x && echo WRITABLE || echo READONLY' || true

misconfigurations:
  - id: DS-0002
    paths:
      - Dockerfile
    statement: >-
      The final image runs every service as the databasus user. start.sh starts
      as root only to remap PUID and PGID values and prepare the mounted data
      directory, then re-executes itself as databasus with gosu, and that
      non-root process initializes PostgreSQL and runs the application. A
      Dockerfile USER directive would break startup.

name: postgresus-test

x-test-postgres: &test-postgres
  environment:
    POSTGRES_DB: testdb
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpassword
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
    interval: 2s
    timeout: 5s
    retries: 30
  shm_size: 1gb

services:
  app-db:
    image: postgres:17
    environment:
      POSTGRES_DB: postgresus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Q1234567
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgresus"]
      interval: 2s
      timeout: 5s
      retries: 30
    shm_size: 1gb

  test-postgres-12:
    image: postgres:12
    <<: *test-postgres
  test-postgres-13:
    image: postgres:13
    <<: *test-postgres
  test-postgres-14:
    image: postgres:14
    <<: *test-postgres
  test-postgres-15:
    image: postgres:15
    <<: *test-postgres
  test-postgres-16:
    image: postgres:16
    <<: *test-postgres
  test-postgres-17:
    image: postgres:17
    <<: *test-postgres
  test-postgres-18:
    image: postgres:18
    <<: *test-postgres

  test-minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: testuser
      MINIO_ROOT_PASSWORD: testpassword
    command: server /data --console-address ":9001"

  test-azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0

  test-nas:
    image: dperson/samba:latest
    environment:
      USERID: 1000
      GROUPID: 1000
    volumes:
      - test-nas-data:/shared
    command: >
      -u "testuser;testpassword"
      -s "backups;/shared;yes;no;no;testuser"
      -p

  test-ftp:
    # The task brief's documented fallback for this service is
    # stilliard/pure-ftpd:latest with platform: linux/amd64. That image has
    # no arm64 manifest at all, and running it under Docker Desktop's Rosetta
    # emulation on this host fails outright ("rosetta error:
    # mmap_anonymous_rw mmap failed") — pure-ftpd never comes up and every
    # FTP test fails with "failed to dial FTP server: EOF". So we stay on
    # delfer/alpine-ftp-server, which has a native arm64 image.
    #
    # Its entrypoint has a genuine, host-load-correlated boot race: vsftpd
    # occasionally dies moments after (or fails to ever reach) a successful
    # bind on :21. When that happens the image's own supervisor (pidproxy)
    # logs "process has died, quitting" and the *container* exits 0 — always
    # 0, because pidproxy itself exits cleanly once it notices its monitored
    # pid is gone. `restart: on-failure` never sees a failure to react to, so
    # it is a no-op here; the container just stays dead until something
    # notices the ensuing FTP-dial failures deep inside the Go test run.
    # `restart: unless-stopped` restarts unconditionally on any exit,
    # regardless of code, which is what actually recovers this container
    # (verified: forcing this policy through repeated deaths recovered every
    # time, typically within 1-2s per attempt).
    #
    # The healthcheck below is observability only — do NOT gate
    # backend-tests' dependency on `condition: service_healthy`. Compose's
    # service_healthy wait treats a health status of "unhealthy" as terminal
    # for the whole `run`, even though this container's own restart policy
    # would have recovered it a couple of seconds later: reproduced directly,
    # 2 of 5 cold `docker compose run --rm backend-tests` invocations aborted
    # with "dependency failed to start: container ... is unhealthy" while
    # test-ftp was mid-restart-and-about-to-be-fine. So the container-level
    # fix (restart: unless-stopped) and a service_healthy gate actively fight
    # each other — the gate turns a two-second recoverable blip into a hard
    # failure at close to the original bug's rate. Recovery-tolerant waiting
    # is left entirely to run-tests.sh's existing wait_for_tcp loop (60
    # attempts, 1/s against test-ftp:21), which — unlike the compose
    # dependency-wait — just keeps retrying through a death-and-restart cycle
    # by construction.
    image: delfer/alpine-ftp-server:latest
    restart: unless-stopped
    environment:
      USERS: "testuser|testpassword|/ftp/testuser"
      ADDRESS: test-ftp
      MIN_PORT: 30000
      MAX_PORT: 30009
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 21"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    depends_on:
      app-db:
        condition: service_healthy
      test-postgres-12:
        condition: service_healthy
      test-postgres-13:
        condition: service_healthy
      test-postgres-14:
        condition: service_healthy
      test-postgres-15:
        condition: service_healthy
      test-postgres-16:
        condition: service_healthy
      test-postgres-17:
        condition: service_healthy
      test-postgres-18:
        condition: service_healthy
      test-minio:
        condition: service_started
      test-azurite:
        condition: service_started
      test-nas:
        condition: service_started
      test-ftp:
        condition: service_started
    environment:
      ENV_MODE: development
      POSTGRES_INSTALL_DIR: /opt/pg-tools
      DATABASE_DSN: "host=app-db user=postgres password=Q1234567 dbname=postgresus port=5432 sslmode=disable"
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgres://postgres:Q1234567@app-db:5432/postgresus?sslmode=disable"
      GOOSE_MIGRATION_DIR: "."
      TEST_POSTGRES_12_ADDR: test-postgres-12:5432
      TEST_POSTGRES_13_ADDR: test-postgres-13:5432
      TEST_POSTGRES_14_ADDR: test-postgres-14:5432
      TEST_POSTGRES_15_ADDR: test-postgres-15:5432
      TEST_POSTGRES_16_ADDR: test-postgres-16:5432
      TEST_POSTGRES_17_ADDR: test-postgres-17:5432
      TEST_POSTGRES_18_ADDR: test-postgres-18:5432
      TEST_MINIO_ADDR: test-minio:9000
      TEST_AZURITE_ADDR: test-azurite:10000
      TEST_NAS_ADDR: test-nas:445
      TEST_FTP_ADDR: test-ftp:21
    volumes:
      - ./backend:/app/backend
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test

volumes:
  test-nas-data:
  go-mod-cache:
  go-build-cache:
